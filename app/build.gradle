plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.webgateway'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dsh.webgateway'
        minSdk 26
        targetSdk 35
        versionCode 281
        versionName '2.8.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
