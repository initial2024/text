plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.webgateway'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dsh.webgateway'
        minSdk 26
        targetSdk 35
        versionCode 240
        versionName '2.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
