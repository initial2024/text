name: 'OGRELAY11 process-scoped IPv4 preferred public SSE client'
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/relay-tests/omnigate_remote_sse_receipt.mjs'
      - 'original-core-addon/integrated-v05/relay-tests/omnigate_ipv4_preference.mjs'
      - 'original-core-addon/integrated-v05/relay-tests/omnigate_ipv4_preference.test.mjs'
      - '.github/workflows/ogrelay11-ipv4-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipv4-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Run process-scoped connection policy and no-network tests
        shell: bash
        run: |
          set -euo pipefail
          R=original-core-addon/integrated-v05/relay-tests
          node --check "$R/omnigate_remote_sse_receipt.mjs"
          node --check "$R/omnigate_ipv4_preference.mjs"
          node --test "$R/omnigate_ipv4_preference.test.mjs"
          node --test "$R/omnigate_network_error.test.mjs"
          node --test "$R/sse_receipt_audit.test.mjs"
          node "$R/omnigate_remote_sse_receipt.mjs" > dry-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('original-core-addon/integrated-v05/relay-tests')
          s=(r/'omnigate_remote_sse_receipt.mjs').read_text()
          x=json.loads(Path('dry-run.json').read_text())
          assert x['verdict']=='DRY_RUN_NO_NETWORK' and x['requests_sent']==0
          assert "args[0]==='--diagnose'||args[0]==='--execute'" in s
          assert 'networkMode?configureIpv4PreferredFetch():null' in s
          assert "redirect:'manual'" in s and "redirect:'error'" not in s
          assert 'OMNIGATE_PUBLIC_API_KEY' in s
          assert "fetch(endpoint" in s
          assert 'response_body_logged:false' in s
          p=(r/'omnigate_ipv4_preference.mjs').read_text()
          assert "setDefaultResultOrder('ipv4first')" in p
          assert "setDefaultAutoSelectFamily(false)" in p
          print('OGRELAY11_SINGLE_PROCESS_IPV4_PREFERRED=PASS')
          print('OGRELAY11_DRY_RUN_ZERO_NETWORK_ZERO_API_KEY=PASS')
          print('OGRELAY11_REAL_MODEL_POST=NOT_TESTED')
          PY
