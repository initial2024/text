name: 'OGBRAND02 true integrated full-APK splash component compile'
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/OmniGateSplashActivity.java'
      - 'original-core-addon/integrated-v05/library/src/main/AndroidManifest.xml'
      - 'original-core-addon/integrated-v05/OGBRAND02_PRIVATE_APK_SPLASH_GATE.md'
      - '.github/workflows/ogbrand02-private-full-splash.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compile-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - run: gradle -p original-core-addon/integrated-v05 :library:assembleDebug --no-daemon
      - name: Verify private APK integration prerequisites are explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('original-core-addon/integrated-v05')
          java=(p/'library/src/main/java/com/omnigate/integrated/OmniGateSplashActivity.java').read_text()
          xml=(p/'library/src/main/AndroidManifest.xml').read_text()
          doc=(p/'OGBRAND02_PRIVATE_APK_SPLASH_GATE.md').read_text()
          assert 'class OmniGateSplashActivity extends Activity' in java
          assert 'OmniGateHomeActivity.class' in java
          assert 'ValueAnimator.areAnimatorsEnabled()' in java
          assert 'removeCallbacks(next)' in java
          assert 'android:name="com.omnigate.integrated.OmniGateSplashActivity"' in xml
          assert 'android.intent.category.LAUNCHER' not in xml
          assert 'bfdc4de8538066d29ecd17e80ab651d38ae3c440713f9651bd8ce1c81015d27d' in doc
          assert 'not the user' in doc and 'NOT YET DONE' in doc
          print('OGBRAND02_SPLASH_ACTIVITY_COMPILES=PASS')
          print('OGBRAND02_SOLE_PRIVATE_LAUNCHER_BINARY_PATCH=NOT_DONE')
          print('OGBRAND02_PRIVATE_FIXED_SIGNED_FULL_APK=NOT_DONE')
          PY
