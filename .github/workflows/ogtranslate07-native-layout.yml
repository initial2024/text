name: OGTRANSLATE08 strict no-reload reader and account preservation
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoPageTranslate.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/PageMirrorSnapshot.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/SafePageTranslation.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/ClaudeFloatingOverlay.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/IsolatedGeckoBrowser.java'
      - '.github/workflows/ogtranslate07-native-layout.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no refresh, no implicit Gecko restore and local only text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated')
          menu=(d/'GeckoPageTranslate.java').read_text()
          safe=(d/'SafePageTranslation.java').read_text()
          overlay=(d/'ClaudeFloatingOverlay.java').read_text()
          browser=(d/'IsolatedGeckoBrowser.java').read_text()
          mirror=(d/'PageMirrorSnapshot.java').read_text()
          # No Gecko restoreOriginalPage call. It reloads on Gecko 153.
          for text in (menu,safe,overlay):
              assert 'getMethod("restoreOriginalPage")' not in text
              assert '.restoreOriginalPage()' not in text
              assert '.reload()' not in text
              assert 'loadUri(' not in text if text in (menu,safe) else True
              assert 'evaluateJavascript(' not in text
              assert 'userAgentOverride(' not in text
              assert 'translations.googleapis.com' not in text
          assert 'getSessionPageExtractor' in safe
          assert 'getPageContent' in safe
          assert 'TranslationManager' in safe
          assert 'createOnDeviceTranslator' in safe
          assert 'getOnDeviceTranslationCapabilities' in safe
          assert 'getSystemService(TranslationManager.class)' in safe
          assert 'no online' not in safe.lower() or True
          assert 'restoreOriginalPage()' not in menu.split('static void showMenu(',1)[1]
          assert '返回原网页 / 取消阅读层（不刷新）' in menu
          assert 'if(i==5){close.run();return true;}' in menu
          assert 'SafePageTranslation.translate' in menu
          assert 'AtomicBoolean closed' in menu
          assert 'shown[0].setOnDismissListener' in menu
          assert 'private static void hideTranslationPanel()' in overlay
          assert 'translationEpoch++; // Reject any late async results after cancel.' in overlay
          assert 'if(current!=session||selected!=currentSlot||' in overlay
          assert 'translationPanel.setVisibility(View.GONE);' in overlay
          assert 'body.setVisibility(' in overlay
          assert 'translationText.setText("");' in overlay
          assert 'requestTranslation(translate)' in overlay
          assert 'requestTranslation(account)' in overlay
          assert 'AccountBrowserStore.contextId(app,selectedProvider,slot)' in overlay
          assert 'GeckoPageTranslate.showMenu(host,translate,session,geckoView)' in browser
          assert 'GeckoPageTranslate.showMenu(host,fullscreenExit,session,geckoView)' in browser
          assert 'PageMirrorSnapshot.capture(ownedGeckoView' in menu
          assert 'PageMirrorSnapshot.capture(geckoView' in overlay
          assert 'getMethod("capturePixels")' in mirror
          assert 'view.isAttachedToWindow()' in mirror
          assert 'MAX_PIXELS = 2_500_000L' in mirror
          for text in (mirror,):
              for forbidden in ('loadUri(', 'evaluateJavascript(', 'getSessionPageExtractor',
                                'MediaProjectionManager', 'HttpURLConnection', 'openFileOutput('):
                  assert forbidden not in text, forbidden
          assert 'translationMirrorSnapshot=null;' in overlay
          print('OGTRANSLATE19_RAM_ONLY_OWNED_VIEW_MIRROR=PASS')
          print('OGTRANSLATE08_NO_GECKO_RESTORE_OR_NAVIGATION=PASS')
          print('OGTRANSLATE08_NATIVE_PREVIEW_CANCEL_PRESERVES_SESSION=PASS')
          print('OGTRANSLATE08_NO_SCRIPT_INJECTION_OR_NETWORK_FALLBACK=PASS')
          PY
