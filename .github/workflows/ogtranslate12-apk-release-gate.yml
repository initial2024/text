name: OGTRANSLATE12 private APK upgrade fail-closed guard
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/tools/verify_private_omnigate_translation_apk.py'
      - 'original-core-addon/integrated-v05/tools/dex_inventory.py'
      - 'original-core-addon/integrated-v05/tools/generate_merged_mlkit_r.py'
      - '.github/workflows/ogtranslate12-apk-release-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Syntax and intentionally missing baseline rejection
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="original-core-addon/integrated-v05/tools/verify_private_omnigate_translation_apk.py"
          python3 -m py_compile "$SCRIPT" original-core-addon/integrated-v05/tools/dex_inventory.py
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          if python3 "$SCRIPT" --baseline "$TMP/missing-v129.apk" \
            --candidate "$TMP/missing-candidate.apk" \
            --report "$TMP/report.json"; then
            echo 'FAIL: missing private baseline unexpectedly passed'
            exit 1
          fi
          python3 - "$TMP/report.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['result']=='BLOCKED'
          assert data['device_e2e']=='NOT_TESTED'
          assert data['structural_pass'] is False
          print('OGTRANSLATE12_MISSING_BASELINE_FAIL_CLOSED=PASS')
          print('OGTRANSLATE12_NO_PRIVATE_SIGNING_KEY_IN_CI=PASS')
          PY

      - name: Real D8 DEX inventory and append-only duplicate-class guard
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/src" "$TMP/classes" "$TMP/dex"
          cat > "$TMP/src/Probe.java" <<'JAVA'
          package omnigate.release.test;
          public final class Probe {
              public Probe(){}
              public String ping(){return "PASS";}
          }
          JAVA
          javac -source 8 -target 8 -d "$TMP/classes" "$TMP/src/Probe.java"
          SDK_ROOT="$ANDROID_HOME"
          D8="$SDK_ROOT/build-tools/35.0.0/d8"
          if [ ! -x "$D8" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
            test -x "$SDKMANAGER"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'build-tools;35.0.0'
          fi
          test -x "$D8"
          "$D8" --min-api 26 --output "$TMP/dex" \
            "$TMP/classes/omnigate/release/test/Probe.class"
          python3 - "$TMP/dex/classes.dex" <<'PY'
          import sys
          sys.path.insert(0,"original-core-addon/integrated-v05/tools")
          from dex_inventory import inventory,DexFormatError
          blob=open(sys.argv[1],"rb").read()
          classes=inventory(blob)
          descriptor="Lomnigate/release/test/Probe;"
          assert descriptor in classes
          assert "ping" in classes[descriptor]
          try:
              inventory(blob[:64])
              raise AssertionError("truncated DEX was accepted")
          except DexFormatError:
              pass
          tool=open("original-core-addon/integrated-v05/tools/verify_private_omnigate_translation_apk.py").read()
          for required in ["all_original_classes4_definitions_retained",
                           "no_duplicate_defined_classes_across_all_dex",
                           "original_classes4_present_and_replaced",
                           "translateOfflineWithConsent",
                           "OfflineMlKitBridge"]:
              assert required in tool,required
          assert "preserve_all_original_dex_bytes" not in tool
          print("OGTRANSLATE15_REAL_D8_CLASS_METHOD_PARSER=PASS")
          print("OGTRANSLATE15_DUPLICATE_CLASS_APPEND_ONLY_BLOCKED=PASS")
          print("OGTRANSLATE15_CLASSES4_REPLACEMENT_REQUIRED=PASS")
          PY

      - name: OGTRANSLATE18 generated AAR resource index prevents NoClassDefFoundError
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          GEN="original-core-addon/integrated-v05/tools/generate_merged_mlkit_r.py"
          python3 -m py_compile "$GEN"
          cat > "$TMP/resources.txt" <<'RES'
          type raw id=0c entryCount=1
            resource 0x7f0c0000 raw/translate_models_metadata
              () (file) res/raw/translate_models_metadata.json
          type xml id=13 entryCount=10
            resource 0x7f130009 xml/rapid_response_client_defaults
              () (file) res/xml/rapid_response_client_defaults.xml
          RES
          python3 "$GEN" --aapt2-resources-dump "$TMP/resources.txt" \
            --out-dir "$TMP/src"
          test -s "$TMP/src/com/google/mlkit/nl/translate/R.java"
          grep -F '0x7f0c0000' "$TMP/src/com/google/mlkit/nl/translate/R.java"
          grep -F '0x7f130009' "$TMP/src/com/google/mlkit/nl/translate/R.java"
          mkdir -p "$TMP/classes" "$TMP/dex"
          javac -source 8 -target 8 -d "$TMP/classes" \
            "$TMP/src/com/google/mlkit/nl/translate/R.java"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          if [ ! -x "$D8" ]; then
            MGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
            "$MGR" --sdk_root="$ANDROID_HOME" 'build-tools;35.0.0'
          fi
          "$D8" --min-api 26 --output "$TMP/dex" \
            "$TMP/classes/com/google/mlkit/nl/translate/R.class" \
            "$TMP/classes/com/google/mlkit/nl/translate/R\$raw.class" \
            "$TMP/classes/com/google/mlkit/nl/translate/R\$xml.class"
          python3 - "$TMP/dex/classes.dex" <<'PY'
          import sys
          sys.path.insert(0,"original-core-addon/integrated-v05/tools")
          from dex_inventory import inventory
          classes=inventory(open(sys.argv[1],"rb").read())
          for name in ("R;","R$raw;","R$xml;"):
              assert "Lcom/google/mlkit/nl/translate/"+name in classes
          verifier=open("original-core-addon/integrated-v05/tools/verify_private_omnigate_translation_apk.py").read()
          for token in ("linked_mlkit_resource_raw","linked_mlkit_resource_xml",
                        'R$raw;', 'R$xml;'):
              assert token in verifier,token
          print("OGTRANSLATE18_RESOURCE_INDEX_CLASSES_GENERATED_IN_D8=PASS")
          print("OGTRANSLATE18_MISSING_R_CLASSES_RELEASE_GATE_BLOCKED=PASS")
          PY
          printf 'resource 0x7f0c0000 raw/translate_models_metadata\n' > "$TMP/broken.txt"
          if python3 "$GEN" --aapt2-resources-dump "$TMP/broken.txt" \
              --out-dir "$TMP/bad"; then
            echo 'Missing ML Kit xml resource was not rejected'
            exit 1
          fi
          echo 'OGTRANSLATE18_MISSING_RESOURCE_FAIL_CLOSED=PASS'
