name: 'OGRELAY08 remote SSE receipt tool offline protocol tests'
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/relay-tests/sse_receipt_audit.mjs'
      - 'original-core-addon/integrated-v05/relay-tests/omnigate_remote_sse_receipt.mjs'
      - 'original-core-addon/integrated-v05/relay-tests/sse_receipt_audit.test.mjs'
      - '.github/workflows/ogrelay08-receipt-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify syntax, SSE parser and default no-request behavior
        shell: bash
        run: |
          set -euo pipefail
          R=original-core-addon/integrated-v05/relay-tests
          node --check "$R/sse_receipt_audit.mjs"
          node --check "$R/omnigate_remote_sse_receipt.mjs"
          node --test "$R/sse_receipt_audit.test.mjs"
          node "$R/omnigate_remote_sse_receipt.mjs" > dry-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('dry-run.json').read_text())
          assert x['verdict']=='DRY_RUN_NO_NETWORK'
          assert x['requests_sent']==0
          src=Path('original-core-addon/integrated-v05/relay-tests/omnigate_remote_sse_receipt.mjs').read_text()
          assert "redirect:'error'" in src
          assert "tools:undefined" in src
          assert "OMNIGATE_PUBLIC_API_KEY" in src
          assert "max_tokens:48" in src
          assert 'fetch(endpoint' in src
          assert 'for(' not in src or 'fetch(endpoint' in src
          assert 'response_body_logged:false' in src
          assert 'Authorization:' in src
          assert 'no-body' not in src
          print('OGRELAY08_DRY_RUN_NO_NETWORK=PASS')
          print('OGRELAY08_REAL_PUBLIC_STREAM=NOT_TESTED')
          PY
