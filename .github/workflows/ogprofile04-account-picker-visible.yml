name: 'OGPROFILE04 directly switch provider and account in visible Android list'
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/IsolatedGeckoBrowser.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/AccountQuickSwitchRows.java'
      - 'original-core-addon/integrated-v05/relay-tests/AccountQuickSwitchRowsTest.java'
      - '.github/workflows/ogprofile04-account-picker-visible.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  visible-picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Validate direct account slots and Android AlertDialog content contract
        shell: bash
        run: |
          set -euo pipefail
          R=original-core-addon/integrated-v05
          OUT="$(mktemp -d)"
          trap 'rm -rf "$OUT"' EXIT
          javac -d "$OUT" \
            "$R/library/src/main/java/com/omnigate/integrated/AccountBrowserSlots.java" \
            "$R/library/src/main/java/com/omnigate/integrated/AccountQuickSwitchRows.java" \
            "$R/relay-tests/AccountQuickSwitchRowsTest.java"
          java -cp "$OUT" com.omnigate.integrated.AccountQuickSwitchRowsTest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated')
          src=(p/'IsolatedGeckoBrowser.java').read_text()
          picker=src[src.index('static void showPicker(Activity host)'):
                     src.index('static void show(Activity host,String provider)')]
          assert '.setMessage(' not in picker
          assert '.setItems(labels,(dialog,which)->{' in picker
          assert 'AccountQuickSwitchRows.build(counts,selected)' in picker
          assert 'show(host,rows[which].provider,rows[which].slot)' in picker
          assert 'switchTo(startingSlot)' in src
          assert 'AccountBrowserStore.contextId(host,provider,index)' in src
          assert 'getMethod("contextId",String.class)' in src
          assert 'new GeckoRuntime(' not in src
          assert 'setNegativeButton("取消",null).show()' in picker
          home=(p/'OmniGateHomeActivity.java').read_text()
          assert 'button(main,"账号切换 / 多账号备份",true' in home
          print('OGPROFILE04_NO_ALERT_DIALOG_MESSAGE_ITEMS_CONFLICT=PASS_STATIC')
          print('OGPROFILE04_VISIBLE_FIRST_SCREEN_DIRECT_ACCOUNT_SELECT=PASS_STATIC')
          print('OGPROFILE04_MODEL_POST_AUTOMATIC_REPLAY=ZERO')
          print('OGPROFILE04_REAL_ANDROID_NAVIGATION=NOT_TESTED')
          PY
