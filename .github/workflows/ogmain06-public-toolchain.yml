name: OGMAIN06 public Android binary toolchain export
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths: ['.github/workflows/ogmain06-public-toolchain.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch pinned public smali assemblers and SDK signing utilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          BASE=https://github.com/baksmali/smali/releases/download/3.0.10
          curl --fail --location --retry 3 -o output/baksmali-fat.jar "$BASE/baksmali-3.0.10-fat.jar"
          curl --fail --location --retry 3 -o output/smali-fat.jar "$BASE/smali-3.0.10-fat.jar"
          printf '%s  %s\n' \
            '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f' output/baksmali-fat.jar \
            '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a' output/smali-fat.jar \
              | sha256sum --check
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          cp "$APKSIGNER" output/apksigner
          cp "$ZIPALIGN" output/zipalign
          AAPT2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -n "$AAPT2"
          cp "$AAPT2" output/aapt2
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" output/apksigner.jar
          LIBCXX=$(find "$(dirname "$ZIPALIGN")" -name 'libc++.so' -type f | head -1)
          test -n "$LIBCXX"
          cp "$LIBCXX" output/libc++.so
          chmod +x output/apksigner output/zipalign output/aapt2
          java -jar output/baksmali-fat.jar --version
          java -jar output/smali-fat.jar --version
          ls -lh output/
          (cd output && sha256sum * > tool-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: OGMAIN06-public-toolchain-no-user-data
          path: output/
          retention-days: 2
          if-no-files-found: error
