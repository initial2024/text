name: Original Core Add-on static gate

on:
  push:
    branches: [ original-core-addon ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Baseline contract assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"port": 1601' original-core-addon/BASELINE_LOCK.json
          grep -F 'base2-no-truncate-600s.apk' original-core-addon/BASELINE_LOCK.json
          grep -F 'c54743ff1b76c6449dad5a1e3199eee5c2dc8dde56f6a87e84cfe95d7669bd35' original-core-addon/BASELINE_LOCK.json
          grep -F 'TIMEOUT_SECONDS = 3600' original-core-addon/patch/patch_dex_3600.py

      - name: No-random-interruption synthetic gate
        shell: bash
        run: |
          set -euo pipefail
          node original-core-addon/tests/no_interrupt.test.js

      - name: Reviewable bridge patch policy gate
        shell: bash
        run: |
          set -euo pipefail
          P=original-core-addon/patch/bridge-addon.patch
          grep -F '+  const GENERATION_ACTIVITY_GRACE_MS = 10000;' "$P"
          grep -F '+  const MAX_AUTO_ROLLOVERS = 3;' "$P"
          grep -F 'Do not stop a live generation to roll over.' "$P"
          grep -F 'submission.attachments.filter(item => item.current)' "$P"
          grep -F 'currentLimitNoticeInfo()' "$P"
          ! grep -E '^[+-].*function (findFileInput|uploadAttachments|submitContentEditable|submitTextarea|sendPrompt)\b' "$P"
          ! grep -E '^\+.*(clickStop|stopGenerating|abortGeneration|cancelGeneration)' "$P"

      - name: Repository confidentiality boundary
        shell: bash
        run: |
          set -euo pipefail
          ! find original-core-addon -type f | grep -E '\.(jks|keystore|apk)$'
          ! grep -RIlE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' original-core-addon

      - name: Fixed-signing policy gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BF:DC:4D:E8:53:80:66:D2:9E:CD:17:E8:0A:B6:51:D3:8A:E3:C4:40:71:3F:96:51:BD:8C:E1:C8:10:15:D2:7D' original-core-addon/SIGNING_POLICY.md
          grep -F 'must never generate a replacement signing key' original-core-addon/SIGNING_POLICY.md
          grep -F 'OMNIGATE_KEYSTORE_B64' .github/workflows/original-core-sidecar-build.yml
          grep -F 'OMNIGATE_KEYSTORE_PASSWORD' .github/workflows/original-core-sidecar-build.yml
          grep -F 'OMNIGATE_KEY_ALIAS' .github/workflows/original-core-sidecar-build.yml
          ! grep -F 'Create ephemeral test signing key' .github/workflows/original-core-sidecar-build.yml
          grep -F 'EXPECTED_CERT="BF:DC:4D:E8:53:80:66:D2:9E:CD:17:E8:0A:B6:51:D3:8A:E3:C4:40:71:3F:96:51:BD:8C:E1:C8:10:15:D2:7D"' original-core-addon/build_from_frozen_baseline.sh
          grep -F 'FIXED_SIGNING_IDENTITY=PASS' original-core-addon/verify_fixed_signing.sh
          grep -F 'EXPECTED_BASE="16d78e8a33452571ae18ee13dcd792bd06a4e9b4d185ebda004c14295a88a355"' original-core-addon/build_from_frozen_baseline.sh
