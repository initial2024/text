name: OGLOCAL01 Android Keystore loopback owner contract
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GatewayApp.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/SidecarProxyServer.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/CloudflareRelayClient.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/LocalProxyRuntime.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/OverlayTextClient.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/OverlayUploadClient.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/CompatSettingsActivity.java'
      - '.github/workflows/oglocal01-keystore-loopback-owner-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Strict local-vs-relay key separation and no upstream exfil
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated')
          read=lambda name:(p/name).read_text()
          g=read('GatewayApp.java')
          proxy=read('SidecarProxyServer.java')
          relay=read('CloudflareRelayClient.java')
          local=read('LocalProxyRuntime.java')
          ui=read('CompatSettingsActivity.java')
          internal=(read('OverlayTextClient.java'),read('OverlayUploadClient.java'))
          assert 'AndroidKeyStore' in g
          assert 'KEY_ALGORITHM_HMAC_SHA256' in g
          assert 'KeyProperties.PURPOSE_SIGN' in g
          assert 'localApiKeyMatches' in g
          assert 'MessageDigest.isEqual' in g
          assert 'NoBackupFilesDir' not in g # key not backed up in preferences
          assert 'prefs().edit().putString("api_key"' in g # old public key separate
          assert 'new IllegalStateException("local_auth_keystore_unavailable"' in g
          assert 'GatewayApp.localApiKey();' in local
          assert 'local_auth_keystore_unavailable' not in local or 'GatewayApp.localApiKey();' in local
          assert 'hasAnyLocalKey(' not in proxy
          assert 'localhost-any-nonempty' not in proxy
          assert 'hasExactLocalKey(request)' in proxy
          assert '!GatewayApp.localApiKeyMatches(' in proxy
          assert 'x-omnigate-instance-key' in proxy
          upstream=proxy.split('private void proxyToFrozenCore(',1)[1].split('private static boolean ',1)[0]
          assert '"x-omnigate-instance-key".equals(lower)' in upstream
          assert '"x-omnigate-public-relay".equals(lower)' in upstream
          assert 'x-omnigate-instance-key".equals(lower)' in relay
          assert 'GatewayApp.localApiKey()' in relay
          assert 'conn.setRequestProperty("X-OmniGate-Instance-Key"' in relay
          for value in internal:
              assert 'GatewayApp.localApiHeader()' in value
              assert 'Bearer test' not in value
          assert 'GatewayApp.localApiHeader()' in ui
          assert '复制当前安装的本地 8787 Key' in ui
          assert '复制公网 Relay API Key' in ui
          assert '原本地兼容模式仍接受任意非空' not in ui
          print('OGLOCAL01_KEYSTORE_NONEXPORTABLE_HMAC_SOURCE=PASS')
          print('OGLOCAL01_LOOPBACK_EXACT_BEARER_AND_RELAY_INSTANCE=PASS')
          print('OGLOCAL01_INTERNAL_CLIENTS_AND_UI_MIGRATED=PASS')
          print('OGLOCAL01_NATIVE_KEYSTORE_AND_OEM_CLONE_RUNTIME=NOT_TESTED')
          PY
