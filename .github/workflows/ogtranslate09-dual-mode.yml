name: OGTRANSLATE09 optional original vs no-reload default
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoOriginalTranslation.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoPageTranslate.java'
      - '.github/workflows/ogtranslate09-dual-mode.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require default safe mode and explicit legacy opt-in warnings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated')
          default=(d/'GeckoPageTranslate.java').read_text()
          legacy=(d/'GeckoOriginalTranslation.java').read_text()
          safety=(d/'SafePageTranslation.java').read_text()
          overlay=(d/'ClaudeFloatingOverlay.java').read_text()
          browser=(d/'IsolatedGeckoBrowser.java').read_text()
          assert 'menu.getMenu().add(0,7,6,"高级：本次启用旧版整页翻译（可能刷新）")' in default
          assert 'if(i==7)' in default
          assert 'GeckoOriginalTranslation.showConsent(c,anchor,session)' in default
          assert 'SafePageTranslation.translate(c,session,from,to,' in default
          assert 'if(i==5){close.run();return true;}' in default
          assert '.restoreOriginalPage()' not in default
          assert 'getMethod("restoreOriginalPage")' not in default
          assert 'getMethod("restoreOriginalPage")' in legacy
          assert 'if(item.getItemId()==3)showOptions(c,anchor,ownedSession);' in legacy
          assert 'if(item.getItemId()==2)run(c,session,null,null,true);' in legacy
          assert '恢复原文可能重新加载网页、丢失草稿' in legacy
          assert '仅本次启用原生整页翻译' in legacy
          assert 'setTranslationsSessionDelegate' in legacy
          for source in (legacy,default,safety):
              assert 'userAgentOverride(' not in source
              assert 'evaluateJavascript(' not in source
              assert 'setAlwaysTranslate' not in source
              assert 'startActivity(' not in source
          assert 'GeckoPageTranslate.showMenu(host,translate,session)' in browser
          assert 'GeckoPageTranslate.showMenu(app,anchor,current,' in overlay
          assert 'hideTranslationPanel()' in overlay
          assert 'translationEpoch++; // Reject any late async results after cancel.' in overlay
          print('OGTRANSLATE09_DEFAULT_SAFE_READER=PASS')
          print('OGTRANSLATE09_LEGACY_EXPLICIT_PER_USE_CONSENT=PASS')
          print('OGTRANSLATE09_RESTORE_RELOAD_DOUBLE_CONFIRMED=PASS')
          print('OGTRANSLATE09_NO_AUTOMATED_SEND_OR_SPOOFING=PASS')
          PY
