name: 'OGHOUR01 self-managed rolling-hour and daily account budgets'
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/AccountBrowserStore.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/SlidingHourAcknowledgements.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/AccountBudgetAdvisor.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/VoluntaryAccountBudget.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/IsolatedGeckoBrowser.java'
      - 'original-core-addon/integrated-v05/relay-tests/SlidingHourBudgetTest.java'
      - '.github/workflows/ogh0ur01-sliding-budgets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  window-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Sliding hour budget invariants
        shell: bash
        run: |
          set -euo pipefail
          R=original-core-addon/integrated-v05
          OUT="$(mktemp -d)"
          trap 'rm -rf "$OUT"' EXIT
          javac -d "$OUT" "$R/library/src/main/java/com/omnigate/integrated/AccountBrowserSlots.java" \
            "$R/library/src/main/java/com/omnigate/integrated/VoluntaryAccountBudget.java" \
            "$R/library/src/main/java/com/omnigate/integrated/AccountBudgetAdvisor.java" \
            "$R/library/src/main/java/com/omnigate/integrated/SlidingHourAcknowledgements.java" \
            "$R/relay-tests/SlidingHourBudgetTest.java"
          java -cp "$OUT" com.omnigate.integrated.SlidingHourBudgetTest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated')
          store=(p/'AccountBrowserStore.java').read_text()
          ui=(p/'IsolatedGeckoBrowser.java').read_text()
          assert 'usesLastHour(' in store
          assert 'allUsesLastHour(' in store
          assert 'SlidingHourAcknowledgements.append(' in store
          assert 'evaluateWithHour(' in ui
          assert 'voluntaryBrowserSwitchPermitted(provider)' in ui
          assert 'only' not in ui or 'platform' in ui.lower()
          print('OGHOUR01_UI_WIRING=PASS_STATIC')
          PY
