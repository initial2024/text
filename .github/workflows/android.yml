name: Build OmniGate Companion APK

on:
  push:
    branches: [ chatgpt/omnigate-companion-v1 ]
  workflow_dispatch:

concurrency:
  group: omnigate-companion-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate and install Android SDK packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Companion architecture gates
        shell: bash
        run: |
          set -euo pipefail

          # Companion is a sidecar. It must not instantiate a second browser UI.
          if grep -F 'webView = new WebView(this);' app/src/main/java/com/dsh/webgateway/MainActivity.java; then
            echo "Companion must not instantiate its own WebView" >&2
            exit 1
          fi

          grep -F 'ORIGINAL_BASE = "http://127.0.0.1:1601"' app/src/main/java/com/dsh/webgateway/OriginalGatewayProxy.java
          grep -F 'OriginalGatewayProxy.proxy(' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'continuing background drain' app/src/main/java/com/dsh/webgateway/OriginalGatewayProxy.java
          grep -F 'HARD_READ_TIMEOUT_MS = 3_660_000' app/src/main/java/com/dsh/webgateway/OriginalGatewayProxy.java
          grep -F 'conn.setReadTimeout(3_660_000);' app/src/main/java/com/dsh/webgateway/CloudflareRelayClient.java

          # API-key boundary: any non-empty key on local 8787; exact key on public relay.
          grep -F 'localhost-any-nonempty' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'public-exact' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'X-OmniGate-Public-Relay' app/src/main/java/com/dsh/webgateway/CloudflareRelayClient.java
          grep -F 'Bearer omnigate-local' app/src/main/java/com/dsh/webgateway/OriginalGatewayProxy.java

          # User-owned public relay remains available.
          grep -F 'OWN_PUBLIC_BASE = "https://gw-33e850180248.claua.de"' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F 'OWN_RELAY_WS = "wss://gw-33e850180248.claua.de/__device"' app/src/main/java/com/dsh/webgateway/GatewayApp.java

          # Original browser/overlay remains inside com.deepseek2.app.
          # The original OverlayService is exported=false, so Companion must
          # launch only the exported ProviderActivity and never target that service.
          grep -F '<package android:name="com.deepseek2.app" />' app/src/main/AndroidManifest.xml
          grep -F 'com.deepseek2.app.ui.ProviderActivity' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'com.deepseek2.app.ui.ProviderActivity' app/src/main/java/com/dsh/webgateway/GatewayService.java
          if grep -F 'com.deepseek2.app.ui.OverlayService' app/src/main/java/com/dsh/webgateway/MainActivity.java; then
            echo "Companion must not call original non-exported OverlayService" >&2
            exit 1
          fi
          if grep -F 'SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml; then
            echo "Companion must not request its own overlay permission" >&2
            exit 1
          fi
          if grep -F 'FloatingOverlayService' app/src/main/AndroidManifest.xml; then
            echo "Companion must not register a second floating-window service" >&2
            exit 1
          fi

          grep -F 'versionCode 301' app/build.gradle
          grep -F "versionName '1.0.1'" app/build.gradle
          grep -F 'OmniGate Companion' app/src/main/res/values/strings.xml

      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate Android build tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.sdk.outputs.root }}/build-tools/35.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          test -x "$BT/aapt2"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Create one-time test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore build-key.jks \
            -storepass changeit \
            -keypass changeit \
            -alias companion \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=OmniGate Companion Test,O=Temporary Test Build,L=Local,C=US"

      - name: Zipalign and sign
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/OmniGate-Companion-aligned.apk"
          FINAL="app/build/outputs/apk/release/OmniGate-Companion-v1.0.1.apk"
          BT="${{ steps.bt.outputs.dir }}"
          "$BT/zipalign" -p -f -v 4 "$UNSIGNED" "$ALIGNED" > zipalign.txt
          "$BT/zipalign" -c -v 4 "$ALIGNED" >> zipalign.txt
          "$BT/apksigner" sign \
            --ks build-key.jks --ks-key-alias companion \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee apksigner-verify.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-verify.txt
          sha256sum "$FINAL" | tee SHA256SUMS.txt

      - name: Inspect package and version
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.bt.outputs.dir }}"
          FINAL="app/build/outputs/apk/release/OmniGate-Companion-v1.0.1.apk"
          "$BT/aapt2" dump badging "$FINAL" | tee aapt-badging.txt
          grep -F "package: name='com.dsh.webgateway'" aapt-badging.txt
          grep -F "versionCode='301'" aapt-badging.txt
          grep -F "versionName='1.0.1'" aapt-badging.txt
          grep -F "application-label:'OmniGate Companion'" aapt-badging.txt
          grep -F "minSdkVersion:'26'" aapt-badging.txt
          grep -F "targetSdkVersion:'35'" aapt-badging.txt

      - name: Build verification report
        shell: bash
        run: |
          {
            echo "# OmniGate Companion 1.0.1 build verification"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Architecture: 8787 companion proxy -> frozen original AI Gateway 1601"
            echo
            echo "Original browser automation is not reimplemented in this APK."
            echo
            echo "Downstream disconnects are drained instead of immediately closing the 1601 upstream."
            echo
            echo
            echo '## SHA256'
            cat SHA256SUMS.txt
            echo
            echo '## Signature'
            cat apksigner-verify.txt
            echo
            echo '## Package'
            cat aapt-badging.txt
          } > BUILD_VERIFICATION.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniGate-Companion-v1.0.1-apk
          path: |
            app/build/outputs/apk/release/OmniGate-Companion-v1.0.1.apk
            BUILD_VERIFICATION.md
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="omnigate-companion-v1.0.1-test"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            app/build/outputs/apk/release/OmniGate-Companion-v1.0.1.apk \
            BUILD_VERIFICATION.md \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "OmniGate Companion 1.0.1 test build" \
            --notes "Sidecar/proxy for the frozen original AI Gateway core. Does not reimplement browser automation. Test-signed; runtime validation required." \
            --prerelease
