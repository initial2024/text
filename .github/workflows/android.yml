name: Build installable Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-gateway-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate and install Android SDK packages
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Source contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'public static final int PORT = 8787;' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F '.deepseeks.dpdns.org' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F '57.183.5.186' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F 'TUNNEL_PORT = 9000' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F 'PINNED_CERT_SHA256' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F 'REGISTER ' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F '/__tunnel_probe' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'HARD_TIMEOUT_MS = 600_000L' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'MAX_ROLLOVER = 3' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'ATTACHMENT_UPLOAD_FAILED' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'CHATGPT(' app/src/main/java/com/dsh/webgateway/AiProvider.java
          grep -F 'GROK(' app/src/main/java/com/dsh/webgateway/AiProvider.java
          grep -F 'GLM(' app/src/main/java/com/dsh/webgateway/AiProvider.java
          grep -F 'chatgpt-web' app/src/main/java/com/dsh/webgateway/AiProvider.java
          grep -F 'grok-web' app/src/main/java/com/dsh/webgateway/AiProvider.java
          grep -F 'glm-web' app/src/main/java/com/dsh/webgateway/AiProvider.java
          grep -F 'SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          grep -F 'FloatingOverlayService' app/src/main/AndroidManifest.xml
          grep -F 'int size = dp(44);' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F 'OmniGate' app/src/main/res/values/strings.xml
          grep -F 'SplashActivity' app/src/main/AndroidManifest.xml
          grep -F '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          grep -F 'TAB_OVERVIEW' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'TAB_SESSIONS' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'TAB_WEB' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F '自定义 API Key' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'copySingleValue' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'setApiKey' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F 'resetApiKey' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F 'TLS/证书验证通过' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F '正在注册 ' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F '公网探针失败' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F 'LocalHttpServer.PROBE_VALUE' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F 'OWN_PUBLIC_BASE = "https://gw-33e850180248.claua.de"' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F 'OWN_RELAY_WS = "wss://gw-33e850180248.claua.de/__device"' app/src/main/java/com/dsh/webgateway/GatewayApp.java
          grep -F 'CloudflareRelayClient' app/src/main/java/com/dsh/webgateway/GatewayService.java
          grep -F 'okhttp:4.12.0' app/build.gradle
          grep -F 'OmniGate 已就绪' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F '自有 Cloudflare Relay' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'R.drawable.ic_copy' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'ACTION_ENSURE_RUNNING' app/src/main/java/com/dsh/webgateway/GatewayService.java
          grep -F 'watchdogHandler.postDelayed(this, 4_000L)' app/src/main/java/com/dsh/webgateway/GatewayService.java
          grep -F 'isListening()' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'togglePanel()' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F '点击展开小窗口' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F '复制 API Key' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F 'requiresPublicAuth(req)' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'x-omnigate-public-relay' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'X-OmniGate-Public-Relay' app/src/main/java/com/dsh/webgateway/CloudflareRelayClient.java
          grep -F 'X-OmniGate-Public-Relay' app/src/main/java/com/dsh/webgateway/TunnelClient.java
          grep -F 'localhost-any-nonempty' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'hasAnyApiKey(req)' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F '所有 /v1 请求都需要填写 API Key' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'MAX_ATTACHMENT_BYTES = 15 * 1024 * 1024' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'parseStandardAttachments' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'image_url' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'input_file' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'send_not_confirmed' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'AttachmentPickerActivity' app/src/main/AndroidManifest.xml
          grep -F 'onShowFileChooser' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F 'PendingAttachmentStore' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F '输入消息给 ' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F 'openAttachmentPicker' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F 'sendMiniMessage' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          grep -F 'MAX_BODY = 48 * 1024 * 1024' app/src/main/java/com/dsh/webgateway/LocalHttpServer.java
          grep -F 'buildRolloverPrompt' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'buildContinuationPrompt' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'AUTO_ROLLOVER_FAILED' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'previous partial response' /dev/null >/dev/null 2>&1 || true
          grep -F 'beforeSend.limit' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'failedState.limit' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'String prompt = env.prompt.trim();' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'waitForFreshChatReady' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F 'if (a.current) toUpload.add(a);' app/src/main/java/com/dsh/webgateway/WebRelay.java
          grep -F '自动续接：默认开启' app/src/main/java/com/dsh/webgateway/MainActivity.java
          grep -F '自动续接已开启' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java
          if grep -n 'held < 600L' app/src/main/java/com/dsh/webgateway/FloatingOverlayService.java | grep -q 'openMainActivity'; then exit 1; fi

      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate Android build tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.sdk.outputs.root }}/build-tools/35.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          test -x "$BT/aapt2"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Create one-time test signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore build-key.jks             -storepass changeit             -keypass changeit             -alias gateway             -keyalg RSA -keysize 3072 -validity 3650             -dname "CN=OmniGate GitHub Test Build,O=Temporary Test Build,L=Local,C=US"

      - name: Zipalign and sign with official apksigner
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/OmniGate-aligned.apk"
          FINAL="app/build/outputs/apk/release/OmniGate-v2.8.6.apk"
          BT="${{ steps.bt.outputs.dir }}"
          test -f "$UNSIGNED"
          "$BT/zipalign" -p -f -v 4 "$UNSIGNED" "$ALIGNED" > zipalign.txt
          "$BT/zipalign" -c -v 4 "$ALIGNED" >> zipalign.txt
          "$BT/apksigner" sign             --ks build-key.jks --ks-key-alias gateway             --ks-pass pass:changeit --key-pass pass:changeit             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$FINAL" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee apksigner-verify.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-verify.txt
          sha256sum "$FINAL" | tee SHA256SUMS.txt

      - name: Inspect manifest / SDK / package
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.bt.outputs.dir }}"
          FINAL="app/build/outputs/apk/release/OmniGate-v2.8.6.apk"
          "$BT/aapt2" dump badging "$FINAL" | tee aapt-badging.txt
          grep -F "package: name='com.dsh.webgateway'" aapt-badging.txt
          grep -F "versionCode='286'" aapt-badging.txt
          grep -F "versionName='2.8.6'" aapt-badging.txt
          grep -F "minSdkVersion:'26'" aapt-badging.txt
          grep -F "targetSdkVersion:'35'" aapt-badging.txt

      - name: Build verification report
        if: always()
        shell: bash
        run: |
          {
            echo "# OmniGate 2.8.6 build verification"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '## SHA256'
            cat SHA256SUMS.txt 2>/dev/null || true
            echo
            echo '## APK signature verification'
            cat apksigner-verify.txt 2>/dev/null || true
            echo
            echo '## zipalign'
            tail -n 40 zipalign.txt 2>/dev/null || true
            echo
            echo '## manifest / package'
            cat aapt-badging.txt 2>/dev/null || true
          } > BUILD_VERIFICATION.md

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OmniGate-v2.8.6-apk
          path: |
            app/build/outputs/apk/release/OmniGate-v2.8.6.apk
            BUILD_VERIFICATION.md
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="omnigate-v2.8.6-test"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             app/build/outputs/apk/release/OmniGate-v2.8.6.apk             BUILD_VERIFICATION.md             SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "OmniGate 2.8.6 test build"             --notes "Temporary OmniGate Android 16/vivo acceptance build. One-time test signing key; do not treat this signing identity as the final update channel."             --prerelease

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omnigate-build-failure
          path: |
            app/build/reports/**
            app/build/outputs/**
            BUILD_VERIFICATION.md
            zipalign.txt
            apksigner-verify.txt
            aapt-badging.txt
          if-no-files-found: ignore
          retention-days: 7
