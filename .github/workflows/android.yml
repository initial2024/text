name: Build installable Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo y | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned release
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate Android build tools
        id: bt
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Create ephemeral signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore build-key.jks \
            -storepass changeit \
            -keypass changeit \
            -alias gateway \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=DSH Web Gateway GitHub Build,O=Temporary Build,L=Local,C=US"

      - name: Zipalign and sign with official apksigner
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/dsh-web-gateway-aligned.apk"
          FINAL="app/build/outputs/apk/release/dsh-web-gateway-v2.5.0.apk"
          BT="${{ steps.bt.outputs.dir }}"
          test -f "$UNSIGNED"
          "$BT/zipalign" -p -f -v 4 "$UNSIGNED" "$ALIGNED" > zipalign.txt
          "$BT/zipalign" -c -v 4 "$ALIGNED" >> zipalign.txt
          "$BT/apksigner" sign \
            --ks build-key.jks --ks-key-alias gateway \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee apksigner-verify.txt
          sha256sum "$FINAL" | tee SHA256SUMS.txt

      - name: Inspect manifest / SDK / package
        shell: bash
        run: |
          set -euo pipefail
          BT="${{ steps.bt.outputs.dir }}"
          FINAL="app/build/outputs/apk/release/dsh-web-gateway-v2.5.0.apk"
          "$BT/aapt2" dump badging "$FINAL" | tee aapt-badging.txt
          grep -F "package: name='com.dsh.webgateway'" aapt-badging.txt
          grep -F "sdkVersion:'26'" aapt-badging.txt
          grep -F "targetSdkVersion:'35'" aapt-badging.txt

      - name: Build verification report
        if: always()
        shell: bash
        run: |
          {
            echo "# DSH Web Gateway Android build verification"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '## SHA256'
            cat SHA256SUMS.txt 2>/dev/null || true
            echo
            echo '## APK signature verification'
            cat apksigner-verify.txt 2>/dev/null || true
            echo
            echo '## zipalign'
            tail -n 30 zipalign.txt 2>/dev/null || true
            echo
            echo '## manifest / package'
            cat aapt-badging.txt 2>/dev/null || true
          } > BUILD_VERIFICATION.md

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-web-gateway-v2.5.0-apk
          path: |
            app/build/outputs/apk/release/dsh-web-gateway-v2.5.0.apk
            BUILD_VERIFICATION.md
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-web-gateway-build-failure
          path: |
            app/build/reports/**
            app/build/outputs/**
            BUILD_VERIFICATION.md
            zipalign.txt
            apksigner-verify.txt
            aapt-badging.txt
          if-no-files-found: ignore
          retention-days: 7
