name: OGDNS01 Work Profile DNS unknown-host diagnostics safety gate
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoWorkProfileDnsDiagnostics.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoPageFailureUi.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/IsolatedGeckoBrowser.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/ClaudeFloatingOverlay.java'
      - 'original-core-addon/integrated-v05/tools/test_work_profile_dns_diagnostics.py'
      - '.github/workflows/ogdns01-work-profile-dns-host-gate.yml'
  pull_request:
    branches: [original-core-addon]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoWorkProfileDnsDiagnostics.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoPageFailureUi.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/IsolatedGeckoBrowser.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/ClaudeFloatingOverlay.java'
      - 'original-core-addon/integrated-v05/tools/test_work_profile_dns_diagnostics.py'
      - '.github/workflows/ogdns01-work-profile-dns-host-gate.yml'
permissions: {contents: read}
jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify per-profile DNS classification without DNS or VPN circumvention
        shell: bash
        run: |
          set -euo pipefail
          python3 original-core-addon/integrated-v05/tools/test_work_profile_dns_diagnostics.py
