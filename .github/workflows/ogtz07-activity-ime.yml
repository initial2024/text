name: OGTZ07 Activity-owned GeckoView native IME
on:
  push:
    branches: [fix/ogtz07-geckoview-native-ime]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoTimezoneAddonUi.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/CompatSettingsActivity.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/GeckoAddonChoicePrompts.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/ClaudeFloatingOverlay.java'
      - 'original-core-addon/integrated-v05/tools/test_ogtz07_activity_ime.py'
      - '.github/workflows/ogtz07-activity-ime.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compile-and-dex:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Source safety and IME contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 original-core-addon/integrated-v05/tools/test_ogtz07_activity_ime.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Compile integration library
        working-directory: original-core-addon/integrated-v05
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :library:assembleRelease
          test -s library/build/outputs/aar/library-release.aar
      - name: Build compatibility DEX
        working-directory: original-core-addon/integrated-v05
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p standalone-dex/inputs standalone-dex/output
          unzip -p library/build/outputs/aar/library-release.aar classes.jar > standalone-dex/inputs/compat.jar
          OKHTTP="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.squareup.okhttp3/okhttp" -type f -name 'okhttp-4.12.0.jar' | head -1)"
          OKIO="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.squareup.okio/okio-jvm" -type f -name 'okio-jvm-*.jar' | head -1)"
          test -s "$OKHTTP"; test -s "$OKIO"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/d8" --release --min-api 26             --lib "$SDK_ROOT/platforms/android-35/android.jar"             --output standalone-dex/output             standalone-dex/inputs/compat.jar "$OKHTTP" "$OKIO"
          test -s standalone-dex/output/classes.dex
          sha256sum standalone-dex/output/classes.dex | tee standalone-dex/classes.dex.sha256
          echo 'OGTZ07_LIBRARY_AND_DEX_COMPILE=PASS'
          echo 'OGTZ07_VIVO_ANDROID16_IME_E2E=PENDING'
      - uses: actions/upload-artifact@v4
        with:
          name: OmniGate-OGTZ07-compat-dex
          path: |
            original-core-addon/integrated-v05/standalone-dex/output/classes.dex
            original-core-addon/integrated-v05/standalone-dex/classes.dex.sha256
          retention-days: 7
          if-no-files-found: error
