name: 'OGPROFILE02 user-budget auxiliary browser auto-switch without platform bypass'
on:
  push:
    branches: [work/omnigate-integrated-v05]
    paths:
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/VoluntaryAccountBudget.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/AccountBrowserStore.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/IsolatedGeckoBrowser.java'
      - 'original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated/SidecarProxyServer.java'
      - 'original-core-addon/integrated-v05/relay-tests/VoluntaryAccountBudgetTest.java'
      - '.github/workflows/ogprofile02-voluntary-budget.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  user-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Evaluate local budget policy and real app wiring
        shell: bash
        run: |
          set -euo pipefail
          R=original-core-addon/integrated-v05
          OUT="$(mktemp -d)"
          trap 'rm -rf "$OUT"' EXIT
          javac -d "$OUT" \
            "$R/library/src/main/java/com/omnigate/integrated/AccountBrowserSlots.java" \
            "$R/library/src/main/java/com/omnigate/integrated/VoluntaryAccountBudget.java" \
            "$R/relay-tests/VoluntaryAccountBudgetTest.java"
          java -cp "$OUT" com.omnigate.integrated.VoluntaryAccountBudgetTest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('original-core-addon/integrated-v05/library/src/main/java/com/omnigate/integrated')
          b=(p/'IsolatedGeckoBrowser.java').read_text()
          s=(p/'AccountBrowserStore.java').read_text()
          gate=(p/'SidecarProxyServer.java').read_text()
          assert 'private void finishedTurn()' in b
          assert 'if(selected<0||session==null)' in b
          assert b.count('SidecarProxyServer.voluntaryBrowserSwitchPermitted(provider)')>=2
          assert 'recordUserFinishedTurn(host,provider,finishedSlot,now)' in b
          assert 'VoluntaryAccountBudget.evaluateWithHour(' in b
          assert 'AccountBrowserStore.allUsesLastHour(' in b
          assert 'AccountBrowserStore.autoBudgetSwitch(host,provider)' in b
          assert 'open(decision.nextSlot)' in b
          assert '我确认开启' in b
          assert '不会接管原版 8787 模型账号' in b
          assert '不再自动切换' in b
          assert 'new GeckoRuntime(' not in b
          assert 'getMethod("contextId",String.class)' in b
          assert '.commit()' in s and 'Context.MODE_PRIVATE' in s
          assert 'user_auto_switch",false' in s
          assert 'System.currentTimeMillis()' in b
          assert '86_400_000L' in s
          assert 'NATIVE_CHAT_RISK.permission(now).allowed' in gate
          assert 'riskForProvider(channel).permission(now).allowed' in gate
          assert 'catch(RuntimeException invalid){return false;}' in gate
          print('OGPROFILE02_MANUAL_ACK_DAILY_AND_ROLLING_HOUR=PASS_STATIC')
          print('OGPROFILE02_PLATFORM_HOLD_NO_ROTATION_NO_REPOST=PASS_STATIC')
          PY
